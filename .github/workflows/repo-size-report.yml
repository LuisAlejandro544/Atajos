name: Repository Size & Metrics Report

on:
  workflow_dispatch:

concurrency:
  group: repo-size-report-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  analyze-repo-size:
    name: Analyze Repo Size & Metrics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Storage Metrics & Display Summary
        id: generate-report
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          echo "Calculating repository storage metrics..."

          # Overall sizes
          TOTAL_WORKING_DIR_SIZE=$(du -sh --exclude='.git' . | awk '{print $1}')
          TOTAL_GIT_DIR_SIZE=$(du -sh .git 2>/dev/null | awk '{print $1}' || echo "N/A")
          TOTAL_REPO_SIZE=$(du -sh . | awk '{print $1}')
          TOTAL_FILES_COUNT=$(find . -not -path '*/.*' -type f | wc -l)
          TOTAL_COMMITS_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo "0")

          # Lines of code count
          KT_LINES=$(find . -not -path '*/.*' -name "*.kt" -exec cat {} + 2>/dev/null | wc -l || echo "0")
          XML_LINES=$(find . -not -path '*/.*' -name "*.xml" -exec cat {} + 2>/dev/null | wc -l || echo "0")
          GRADLE_LINES=$(find . -not -path '*/.*' \( -name "*.gradle.kts" -o -name "*.gradle" \) -exec cat {} + 2>/dev/null | wc -l || echo "0")
          MD_LINES=$(find . -not -path '*/.*' -name "*.md" -exec cat {} + 2>/dev/null | wc -l || echo "0")
          TOTAL_CODE_LINES=$((KT_LINES + XML_LINES + GRADLE_LINES + MD_LINES))

          # Render metrics directly into GitHub Step Summary
          {
            echo "# 📊 Informe de Peso y Métricas del Repositorio"
            echo ""
            echo "> **Ejecutado:** \`$TIMESTAMP\`"
            echo "> **Rama / Referencia:** \`${{ github.ref_name }}\` (\`${{ github.sha }}\`)"
            echo ""
            echo "---"
            echo ""
            echo "## 📦 Resumen General de Almacenamiento"
            echo ""
            echo "| Métrica | Valor | Descripción |"
            echo "| :--- | :--- | :--- |"
            echo "| **Peso Total del Workspace (Código/Assets)** | **$TOTAL_WORKING_DIR_SIZE** | Espacio ocupado por los archivos del proyecto (sin \`.git\`) |"
            echo "| **Peso del Historial Git (\`.git\`)** | **$TOTAL_GIT_DIR_SIZE** | Historial de versiones y objetos internos de Git |"
            echo "| **Peso Total del Repositorio** | **$TOTAL_REPO_SIZE** | Tamaño combinado en disco |"
            echo "| **Total de Archivos del Proyecto** | **$TOTAL_FILES_COUNT** | Archivos activos en el árbol |"
            echo "| **Total de Commits Registrados** | **$TOTAL_COMMITS_COUNT** | Puntos en la historia de la rama |"
            echo "| **Líneas Totales de Código y Docs** | **$TOTAL_CODE_LINES** | Kotlin ($KT_LINES), XML ($XML_LINES), Gradle ($GRADLE_LINES), Markdown ($MD_LINES) |"
            echo ""
            echo "---"
            echo ""
            echo "## 📁 Peso por Carpetas Principales"
            echo ""
            echo "| Carpeta / Módulo | Tamaño |"
            echo "| :--- | :--- |"

            for dir in app gradle .github assets zip; do
              if [ -d "$dir" ]; then
                SIZE=$(du -sh "$dir" 2>/dev/null | awk '{print $1}')
                echo "| \`$dir/\` | $SIZE |"
              fi
            done

            echo ""
            echo "---"
            echo ""
            echo "## 📄 Peso y Cantidad por Tipo de Archivo"
            echo ""
            echo "| Extensión / Tipo | Cantidad de Archivos | Tamaño Total |"
            echo "| :--- | :--- | :--- |"

            for ext in kt xml kts json md properties gradle png webp jar; do
              COUNT=$(find . -not -path '*/.*' -name "*.$ext" 2>/dev/null | wc -l)
              if [ "$COUNT" -gt 0 ]; then
                SIZE=$(find . -not -path '*/.*' -name "*.$ext" -exec du -ch {} + 2>/dev/null | tail -n 1 | awk '{print $1}')
                echo "| \`.$ext\` | $COUNT | $SIZE |"
              fi
            done

            echo ""
            echo "---"
            echo ""
            echo "## 🔝 Top 10 Archivos Más Pesados del Proyecto"
            echo ""
            echo "| Archivo | Tamaño |"
            echo "| :--- | :--- |"

            find . -not -path '*/.*' -type f -exec du -h {} + 2>/dev/null | sort -rh | head -n 10 | while read -r line; do
              FILE_SIZE=$(echo "$line" | awk '{print $1}')
              FILE_PATH=$(echo "$line" | awk '{$1=""; print $0}' | sed 's/^[ \t]*//')
              echo "| \`$FILE_PATH\` | $FILE_SIZE |"
            done

            echo ""
            echo "---"
            echo "*Visualización en consola y pestaña Summary de GitHub Actions sin modificar el repositorio.*"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Storage analysis complete. View results in the GitHub Actions Step Summary tab."
