name: Emular Android 10 (32-bit x86) y Probar APK

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulate-and-test-32bit:
    name: Emular Android 10 (32-bit) y Probar APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ☕ Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📱 Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔑 Dar permisos de ejecución a los scripts
        run: |
          chmod +x scripts/*/*.sh
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: 🔐 Generar o verificar Android Debug Keystore
        run: ./scripts/build/generate_keystore.sh

      - name: 🛠️ Instalar y configurar CMake 3.22.1 y NDK 27
        run: ./scripts/build/setup_cmake.sh

      - name: 📥 Descargar y preparar fuentes de Lua 5.4.7 puro
        run: ./scripts/lua/setup_lua.sh

      - name: 🐞 Configurar y verificar Lua Debug Library
        run: ./scripts/lua/setup_lua_debug.sh

      - name: 🔍 Descargar y preparar LeakCanary para APK Debug
        run: ./scripts/debug/setup_leakcanary.sh

      - name: 🌐 Descargar y preparar Chucker para APK Debug
        run: ./scripts/debug/setup_chucker.sh

      - name: 🗄️ Descargar y preparar DbInspector para APK Debug
        run: ./scripts/debug/setup_dbinspector.sh

      - name: 🎛️ Descargar y preparar Hyperion para APK Debug
        run: ./scripts/debug/setup_hyperion.sh

      - name: 🛡️ Descargar y preparar ANR-WatchDog para APK Debug
        run: ./scripts/debug/setup_anr_watchdog.sh

      - name: 🎵 Convertir y optimizar recursos de audio a OGG (Cero Latencia)
        run: ./scripts/audio/convert_audio.sh

      - name: 🚀 Compilar APK Debug (Sin Caché)
        run: ./scripts/apk/build_apk_debug.sh

      - name: 📦 Subir APK Debug compilado
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-32bit-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: ⚡ Habilitar Aceleración KVM por Hardware
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: 📲 Instalar Imagen del Sistema y Crear AVD (Android 10 x86 32-bit)
        run: ./scripts/emulator/setup_emulator_32bit.sh

      - name: 🚀 Arrancar Emulador de 32 bits y Esperar Inicio
        run: ./scripts/emulator/start_emulator.sh

      - name: 🧪 Ejecutar Pruebas de Instalación, Memoria y Rendimiento en 32 bits
        run: ./scripts/emulator/test_32bit.sh

      - name: 📸 Guardar Captura de Pantalla del Emulador de 32 bits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-android10-32bit
          path: emulator_32bit_screenshot.png
          if-no-files-found: ignore
          retention-days: 7
