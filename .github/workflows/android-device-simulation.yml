name: Android Device Hardware Simulation & Test

on:
  workflow_dispatch:
    inputs:
      api_level:
        description: 'Nivel de API de Android para el emulador'
        required: false
        default: '34'
        type: choice
        options:
          - '34'
          - '33'
          - '31'
      test_battery_events:
        description: 'Simular eventos de energía y batería (Cargador, 15%, 80%, 100%)'
        required: false
        default: true
        type: boolean
      verify_no_crashes:
        description: 'Verificar ausencia de excepciones fatales en Logcat'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device-simulation:
    name: Simulate Android Device & Trigger Testing
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM Hardware Acceleration
        run: |
          echo "Verificando soporte de aceleración KVM en el runner..."
          if [ -e /dev/kvm ]; then
            sudo chmod 777 /dev/kvm
            echo "KVM habilitado y accesible para el emulador."
          else
            echo "Aviso: /dev/kvm no encontrado. El emulador usará modo emulado."
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle with Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Ensure Debug Keystore is present
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decodificando debug.keystore desde base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generando debug.keystore temporal..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            gradle wrapper
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: |
          echo "Compilando APK de depuración para la simulación en dispositivo..."
          ./gradlew assembleDebug --no-daemon

      - name: Cache Android AVD (Emulator Snapshot)
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-${{ inputs.api_level || '34' }}-x86_64-v1

      - name: Prepare simulation scripts
        run: |
          chmod +x .github/scripts/simulate_device.sh

      - name: Run Android Device Simulation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level || '34' }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          script: .github/scripts/simulate_device.sh "${{ inputs.api_level || '34' }}" "${{ inputs.test_battery_events }}"

      - name: Upload Simulation Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-simulation-logs
          path: simulation_logs.txt
          retention-days: 7
